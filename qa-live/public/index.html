<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Palco Q&amp;A</title>
  <link rel="stylesheet" href="/shared/base.css" />
  <style>
    .options { display: grid; gap: 14px; width: min(360px, 90vw); }
    .options a.card { text-decoration: none; display: block; }
    .options .card h2 { margin: 0 0 4px; font-size: 18px; }
    .options .card p { margin: 0; }
  </style>
</head>
<body>
  <div class="center-screen">
    <div style="display:flex; flex-direction:column; align-items:center; gap:28px;">
      <div class="brand" style="font-size:28px;">Palco<span class="dot">Q&amp;A</span></div>
      <div class="options">
        <a class="card" href="/painel">
          <h2>Sou produtor/apresentador</h2>
          <p class="muted">Criar e moderar uma sessão.</p>
        </a>
        <a class="card" href="/entrar">
          <h2>Sou participante</h2>
          <p class="muted">Entrar com o código da sessão.</p>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
